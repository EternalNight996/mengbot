name: release-linux

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm fakeroot
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
      - name: Attach Linux installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/latest-linux.yml)
          [ ${#files[@]} -gt 0 ] || exit 0
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
